services:
  postgres:
    image: postgres:16
    container_name: sentinelwatch-postgres
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_dev_pw
      POSTGRES_DB: sentinelwatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
