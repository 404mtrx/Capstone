# Production stack. Only the "web" container is reachable from the internet (ports 80/443).
# Postgres, OpenSearch and the API have no published ports: they talk over the private network.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sentinelwatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD}
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -u admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD https://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      opensearch: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+psycopg2://sentinel:${POSTGRES_PASSWORD}@postgres:5432/sentinelwatch
      OPENSEARCH_URL: https://opensearch:9200
      OPENSEARCH_USER: sentinel_app
      OPENSEARCH_PASSWORD: ${OPENSEARCH_APP_PASSWORD}
      OPENSEARCH_VERIFY_CERTS: "false"
      AUTH_REQUIRED: "true"
      SECRET_KEY: ${SECRET_KEY}
      API_KEY: ${API_KEY}
      CORS_ORIGINS: https://${SITE_ADDRESS}

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data

volumes:
  pgdata:
  osdata:
  caddy_data:
